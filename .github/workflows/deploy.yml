name: Deploy verified candidate

on:
  workflow_dispatch:
    inputs:
      candidate_run_id:
        description: Successful FundVal CI main-push run ID
        required: true
        type: string
      candidate_sha:
        description: Exact 40-character candidate commit SHA
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: fundval-production-pages
  cancel-in-progress: false

jobs:
  verify:
    name: verify candidate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    outputs:
      sha: ${{ steps.provenance.outputs.sha }}
      release_fingerprint: ${{ steps.release_fingerprint.outputs.value }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.14.0
      - name: Verify origin CI provenance and protected main ancestry
        id: provenance
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
        run: node scripts/resolve-release-candidate.mjs
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          name: ${{ steps.provenance.outputs.artifact_name }}
          path: ${{ runner.temp }}/candidate
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.provenance.outputs.run_id }}
      - name: Verify archive and every candidate file before extraction
        shell: bash
        env:
          CANDIDATE_REPOSITORY: ${{ github.repository }}
          CANDIDATE_SHA: ${{ steps.provenance.outputs.sha }}
          CANDIDATE_RUN_ID: ${{ steps.provenance.outputs.run_id }}
          CANDIDATE_ATTEMPT: ${{ steps.provenance.outputs.attempt }}
        run: |
          node scripts/release-candidate.mjs verify --bundle "$RUNNER_TEMP/candidate" --output site \
            --repository "$CANDIDATE_REPOSITORY" --sha "$CANDIDATE_SHA" \
            --run-id "$CANDIDATE_RUN_ID" --attempt "$CANDIDATE_ATTEMPT"
      - name: Check candidate release fingerprint
        id: release_fingerprint
        shell: bash
        run: |
          set -euo pipefail
          fingerprint="$(node scripts/release-fingerprint.mjs --directory site)"
          node --input-type=module -e '
            import { readFileSync } from "node:fs";
            const manifest = JSON.parse(readFileSync(process.argv[1], "utf8"));
            if (manifest.releaseFingerprint !== process.argv[2]) throw new Error("Candidate release fingerprint mismatch.");
          ' "$RUNNER_TEMP/candidate/candidate.json" "$fingerprint"
          node scripts/release-fingerprint.mjs --verify-app-chunks-directory site
          node scripts/release-fingerprint.mjs --verify-ocr-directory site/assets/ocr
          node scripts/release-fingerprint.mjs --assert-app-bundle-budget site
          echo "value=${fingerprint}" >> "$GITHUB_OUTPUT"
      - name: Repackage unchanged verified bytes for Pages
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  deploy:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.verify.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.14.0
      - name: Verify Pages publishing mode
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(gh api "repos/${GITHUB_REPOSITORY}/pages" --jq '.build_type')" = workflow
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
      - name: Smoke-test deployed OCR assets
        shell: bash
        env:
          SITE_URL: ${{ steps.deployment.outputs.page_url }}
          EXPECTED_RELEASE_FINGERPRINT: ${{ needs.verify.outputs.release_fingerprint }}
        run: |
          set -euo pipefail
          base="${SITE_URL%/}"
          paths=(
            "js/app-shell.js"
            "js/app-chunks.json"
            "js/update-compat.js"
            "quote-bridge.html"
            "js/sandbox/quote-bridge-runtime.js"
            "ocr-import.html"
            "js/ocr-import-page.js"
            "js/paddle-local-ocr.js"
            "assets/ocr/asset-manifest.json"
            "assets/ocr/paddle/engine/paddle-ocr-engine.mjs"
            "assets/ocr/paddle/engine/assets/fundval-paddle-worker.js"
            "assets/ocr/paddle/models/integrity.json"
            "assets/ocr/paddle/models/PP-OCRv6_tiny_det_onnx_infer.tar"
            "assets/ocr/paddle/models/PP-OCRv6_tiny_rec_onnx_infer.tar"
            "assets/ocr/paddle/ort/ort-wasm-simd-threaded.jsep.mjs"
            "assets/ocr/paddle/ort/ort-wasm-simd-threaded.jsep.wasm"
          )
          for path in "${paths[@]}"; do
            curl --fail --silent --show-error --location --head \
              --retry 12 --retry-all-errors --retry-delay 5 \
              "${base}/${path}?run=${GITHUB_RUN_ID}" > /dev/null
          done
          smoke_dir="$(mktemp -d)"
          manifest_file="${smoke_dir}/release/assets/ocr/asset-manifest.json"
          trap 'rm -rf "$smoke_dir"' EXIT
          mapfile -t release_paths < <(node scripts/release-fingerprint.mjs --list)
          for path in "${release_paths[@]}"; do
            target="${smoke_dir}/release/${path}"
            mkdir -p "$(dirname "$target")"
            curl --fail --silent --show-error --location \
              --retry 12 --retry-all-errors --retry-delay 5 \
              "${base}/${path}?run=${GITHUB_RUN_ID}" > "$target"
          done
          mapfile -t app_chunk_paths < <(node scripts/release-fingerprint.mjs \
            --list-app-chunks "${smoke_dir}/release/js/app-chunks.json")
          for path in "${app_chunk_paths[@]}"; do
            target="${smoke_dir}/release/${path}"
            mkdir -p "$(dirname "$target")"
            curl --fail --silent --show-error --location \
              --retry 12 --retry-all-errors --retry-delay 5 \
              "${base}/${path}?run=${GITHUB_RUN_ID}" > "$target"
          done
          node scripts/release-fingerprint.mjs --verify-app-chunks-directory "${smoke_dir}/release"
          deployed_fingerprint="$(node scripts/release-fingerprint.mjs --directory "${smoke_dir}/release")"
          if [[ -z "$EXPECTED_RELEASE_FINGERPRINT" || "$deployed_fingerprint" != "$EXPECTED_RELEASE_FINGERPRINT" ]]; then
            echo "Deployed release-critical files do not match the built Pages artifact." >&2
            exit 1
          fi
          curl --fail --silent --show-error --location \
            --retry 12 --retry-all-errors --retry-delay 5 \
            "${base}/index.html?run=${GITHUB_RUN_ID}" > "${smoke_dir}/index.html"
          curl --fail --silent --show-error --location \
            --retry 12 --retry-all-errors --retry-delay 5 \
            "${base}/sw.js?run=${GITHUB_RUN_ID}" > "${smoke_dir}/sw.js"
          node --input-type=module --eval '
            import { readFileSync } from "node:fs";
            const [indexPath, workerPath, chunkManifestPath] = process.argv.slice(1);
            const index = readFileSync(indexPath, "utf8");
            const worker = readFileSync(workerPath, "utf8");
            const chunkManifest = JSON.parse(readFileSync(chunkManifestPath, "utf8"));
            const core = worker.slice(worker.indexOf("const CORE"), worker.indexOf("self.addEventListener"));
            if ((index.match(/src="js\/app-shell\.js"/g) || []).length !== 1 || index.includes("js/bootstrap.js")) {
              throw new Error("Deployed index does not exclusively load app-shell.js.");
            }
            const compatOffset = index.indexOf("src=\"js/update-compat.js\"");
            const appOffset = index.indexOf("src=\"js/app-shell.js\"");
            if ((index.match(/src="js\/update-compat\.js"/g) || []).length !== 1
              || compatOffset < 0 || compatOffset > appOffset) {
              throw new Error("Deployed legacy update bridge is missing or loads after app-shell.js.");
            }
            if ((core.match(/\.\/js\/app-shell\.js/g) || []).length !== 1
              || /\.\/js\/(?:bootstrap|app)\.js|\.\/js\/(?:runtime|storage)\//.test(core)) {
              throw new Error("Deployed Service Worker CORE still contains the source module graph.");
            }
            if ((core.match(/\.\/js\/update-compat\.js/g) || []).length !== 1) {
              throw new Error("Deployed Service Worker CORE is missing the legacy update bridge.");
            }
            if (!Array.isArray(chunkManifest.chunks)
              || chunkManifest.chunks.some(chunk => !core.includes("./" + chunk.path))) {
              throw new Error("Deployed Service Worker CORE is missing an app chunk from the release manifest.");
            }
            const quote = String.fromCharCode(39);
            const reloadOption = "{ cache: " + quote + "reload" + quote + " }";
            const revalidateOption = "{ cache: " + quote + "no-cache" + quote + " }";
            if (!worker.includes(reloadOption)
              || !worker.includes("networkOnly(event.request, " + revalidateOption + ")")) {
              throw new Error("Deployed Service Worker is missing release-safe HTTP cache revalidation.");
            }
          ' "${smoke_dir}/index.html" "${smoke_dir}/sw.js" \
            "${smoke_dir}/release/js/app-chunks.json"
          curl --fail --silent --show-error --location \
            --retry 12 --retry-all-errors --retry-delay 5 \
            "${base}/js/ocr-import-page.js?run=${GITHUB_RUN_ID}" > "${smoke_dir}/ocr-import-page.js"
          curl --fail --silent --show-error --location \
            --retry 12 --retry-all-errors --retry-delay 5 \
            "${base}/js/paddle-local-ocr.js?run=${GITHUB_RUN_ID}" > "${smoke_dir}/paddle-local-ocr.js"
          curl --fail --silent --show-error --location \
            --retry 12 --retry-all-errors --retry-delay 5 \
            "${base}/assets/ocr/paddle/engine/paddle-ocr-engine.mjs?run=${GITHUB_RUN_ID}" \
            > "${smoke_dir}/paddle-ocr-engine.mjs"
          node --input-type=module --eval '
            import { readFileSync } from "node:fs";
            const [pagePath, wrapperPath, enginePath] = process.argv.slice(1);
            const page = readFileSync(pagePath, "utf8");
            const wrapper = readFileSync(wrapperPath, "utf8");
            const engine = readFileSync(enginePath, "utf8");
            if (!page.includes("if (typeof source.fallback === ")
              || !page.includes("target.fallback = source.fallback;")
              || page.includes("target.fallback = source.fallback === true")) {
              throw new Error("Deployed OCR page is missing partial-telemetry merge protection.");
            }
            if (!wrapper.includes("normalizePaddleOcrPerformance")
              || !wrapper.includes("error?.performance || ocr?.performance")) {
              throw new Error("Deployed OCR wrapper is missing sanitized failure telemetry.");
            }
            if (!engine.includes("webgpuAttempted") || !engine.includes("fallbackReason")) {
              throw new Error("Deployed Paddle engine is missing backend fallback telemetry.");
            }
          ' "${smoke_dir}/ocr-import-page.js" "${smoke_dir}/paddle-local-ocr.js" \
            "${smoke_dir}/paddle-ocr-engine.mjs"
          mapfile -t ocr_paths < <(node scripts/release-fingerprint.mjs --list-ocr-assets "$manifest_file")
          for path in "${ocr_paths[@]}"; do
            target="${smoke_dir}/release/assets/ocr/${path}"
            mkdir -p "$(dirname "$target")"
            curl --fail --silent --show-error --location \
              --retry 12 --retry-all-errors --retry-delay 5 \
              "${base}/assets/ocr/${path}?run=${GITHUB_RUN_ID}" > "$target"
          done
          node scripts/release-fingerprint.mjs \
            --verify-ocr-directory "${smoke_dir}/release/assets/ocr"
