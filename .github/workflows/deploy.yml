name: Build and Deploy

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fundval-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: 24
        cache: npm
    - name: Install locked dependencies
      run: npm ci
    - name: Audit dependencies
      run: npm audit --audit-level=high --registry=https://registry.npmjs.org
    - name: Test and syntax check
      run: |
        npm test
        npm run check
    - name: Build static Pages artifact
      run: npm run build
    - name: Verify Pages artifact
      shell: bash
      run: |
        test -f site/index.html
        test -f site/ocr-import.html
        test -f site/css/ocr.css
        test -s site/js/app-shell.js
        test -f site/js/version.js
        test -f site/sw.js
        test -s site/data/fund-catalog.json
        test -s site/assets/ocr/asset-manifest.json
        test -f site/assets/ocr/tesseract/tesseract.esm.min.js
        test -f site/assets/ocr/tesseract/worker.min.js
        test -f site/assets/ocr/tesseract-core/tesseract-core-lstm.wasm.js
        test -f site/assets/ocr/tessdata/chi_sim.traineddata.gz
        test -f site/assets/ocr/licenses/tesseract.js-APACHE-2.0.txt
        test -f site/assets/ocr/licenses/tesseract.js-core-APACHE-2.0.txt
        test -f site/assets/ocr/licenses/paddleocr-APACHE-2.0.txt
        test -f site/assets/ocr/licenses/opencv-js-APACHE-2.0.txt
        test -f site/assets/ocr/licenses/js-yaml-MIT.txt
        test -f site/assets/ocr/licenses/onnxruntime-web-MIT.txt
        test -f site/assets/ocr/licenses/clipper-lib-BSL-1.0.txt
        test -f site/assets/ocr/licenses/chi_sim-MIT.txt
        test -f site/assets/ocr/paddle/engine/paddle-ocr-engine.mjs
        test -f site/assets/ocr/paddle/engine/assets/fundval-paddle-worker.js
        test -f site/assets/ocr/paddle/models/PP-OCRv6_tiny_det_onnx_infer.tar
        test -f site/assets/ocr/paddle/models/PP-OCRv6_tiny_rec_onnx_infer.tar
        test -f site/assets/ocr/paddle/models/integrity.json
        test -f site/assets/ocr/paddle/ort/ort-wasm-simd-threaded.mjs
        test -f site/assets/ocr/paddle/ort/ort-wasm-simd-threaded.wasm
        test -f site/assets/ocr/paddle/ort/ort-wasm-simd-threaded.jsep.mjs
        test -f site/assets/ocr/paddle/ort/ort-wasm-simd-threaded.jsep.wasm
        test -f site/THIRD_PARTY_NOTICES.md
    - name: Upload Pages artifact
      uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
      with:
        path: site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Verify Pages publishing mode
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(gh api "repos/${GITHUB_REPOSITORY}/pages" --jq '.build_type')" = workflow
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
      - name: Smoke-test deployed OCR assets
        shell: bash
        env:
          SITE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          base="${SITE_URL%/}"
          paths=(
            "js/app-shell.js"
            "ocr-import.html"
            "js/paddle-local-ocr.js"
            "assets/ocr/asset-manifest.json"
            "assets/ocr/paddle/engine/paddle-ocr-engine.mjs"
            "assets/ocr/paddle/engine/assets/fundval-paddle-worker.js"
            "assets/ocr/paddle/models/integrity.json"
            "assets/ocr/paddle/models/PP-OCRv6_tiny_det_onnx_infer.tar"
            "assets/ocr/paddle/models/PP-OCRv6_tiny_rec_onnx_infer.tar"
            "assets/ocr/paddle/ort/ort-wasm-simd-threaded.jsep.mjs"
            "assets/ocr/paddle/ort/ort-wasm-simd-threaded.jsep.wasm"
          )
          for path in "${paths[@]}"; do
            curl --fail --silent --show-error --location --head \
              --retry 12 --retry-all-errors --retry-delay 5 \
              "${base}/${path}?run=${GITHUB_RUN_ID}" > /dev/null
          done
          smoke_dir="$(mktemp -d)"
          manifest_file="${smoke_dir}/asset-manifest.json"
          trap 'rm -rf "$smoke_dir"' EXIT
          curl --fail --silent --show-error --location \
            --retry 12 --retry-all-errors --retry-delay 5 \
            "${base}/index.html?run=${GITHUB_RUN_ID}" > "${smoke_dir}/index.html"
          curl --fail --silent --show-error --location \
            --retry 12 --retry-all-errors --retry-delay 5 \
            "${base}/sw.js?run=${GITHUB_RUN_ID}" > "${smoke_dir}/sw.js"
          node --input-type=module --eval '
            import { readFileSync } from "node:fs";
            const [indexPath, workerPath] = process.argv.slice(1);
            const index = readFileSync(indexPath, "utf8");
            const worker = readFileSync(workerPath, "utf8");
            const core = worker.slice(worker.indexOf("const CORE"), worker.indexOf("self.addEventListener"));
            if ((index.match(/src="js\/app-shell\.js"/g) || []).length !== 1 || index.includes("js/bootstrap.js")) {
              throw new Error("Deployed index does not exclusively load app-shell.js.");
            }
            if ((core.match(/\.\/js\/app-shell\.js/g) || []).length !== 1
              || /\.\/js\/(?:bootstrap|app)\.js|\.\/js\/(?:runtime|storage)\//.test(core)) {
              throw new Error("Deployed Service Worker CORE still contains the source module graph.");
            }
          ' "${smoke_dir}/index.html" "${smoke_dir}/sw.js"
          curl --fail --silent --show-error --location \
            --retry 12 --retry-all-errors --retry-delay 5 \
            "${base}/assets/ocr/asset-manifest.json?run=${GITHUB_RUN_ID}" > "$manifest_file"
          node --input-type=module --eval '
            import { readFileSync } from "node:fs";
            const [base, manifestPath] = process.argv.slice(1);
            const manifest = JSON.parse(readFileSync(manifestPath, "utf8"));
            if (!Array.isArray(manifest.assets) || !manifest.assets.length) throw new Error("OCR asset manifest is empty.");
            for (const asset of manifest.assets) {
              const path = String(asset?.path || "");
              if (!/^[A-Za-z0-9._/-]+$/.test(path) || path.includes("..") || path.startsWith("/")) {
                throw new Error("OCR asset manifest contains an unsafe path.");
              }
              const url = new URL("assets/ocr/" + path, base);
              if (!url.href.startsWith(base)) throw new Error("OCR asset escaped the deployed site origin.");
              console.log(url.href);
            }
          ' "${base}/" "$manifest_file" | while IFS= read -r asset_url; do
            curl --fail --silent --show-error --location --head \
              --retry 12 --retry-all-errors --retry-delay 5 \
              "${asset_url}?run=${GITHUB_RUN_ID}" > /dev/null
          done
